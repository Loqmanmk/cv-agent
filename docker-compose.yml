services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: cvagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}
      POSTGRES_DB: cvagent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvagent -d cvagent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
